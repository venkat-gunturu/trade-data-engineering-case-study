version: 2

models:
  - name: int_trade_sequence
    description: >
      Reconstructs arrival order for each trade within the run and derives the
      state the business rules need. No business rules are applied here.
    columns:
      - name: surrogate_key
        description: Still one row per RAW row at this layer.
        tests:
          - unique
          - not_null
      - name: trade_id
        tests:
          - not_null
      - name: trade_version
        tests:
          - not_null
      - name: prior_version
        description: >
          Version of the NEXT arrival for this trade in the same run. Non-null
          means this record is superseded by a later arrival; null means it is
          the final arrival, and the one the run acts on.
      - name: previously_established
        description: >
          1 when an earlier arrival for this trade was viable at ingestion time,
          0 when earlier arrivals existed but none were. Null for the first
          arrival of a trade.

  - name: int_trade_validation
    description: >
      Classifies every staged trade as ACCEPTED or REJECTED against the mandatory
      business rules. One row per staged trade; nothing is filtered out here so
      the audit trail stays complete.
    columns:
      - name: surrogate_key
        description: Still one row per RAW row at this layer.
        tests:
          - unique
          - not_null
      - name: trade_id
        tests:
          - not_null
      - name: trade_version
        tests:
          - not_null
      - name: validation_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACCEPTED', 'REJECTED']
      - name: rejection_reason
        description: Null for accepted records; set for every rejected record.
        tests:
          - accepted_values:
              arguments:
                values: ['LOWER_VERSION', 'PAST_MATURITY']
              config:
                where: "validation_status = 'REJECTED'"
      - name: processed_at
        tests:
          - not_null
