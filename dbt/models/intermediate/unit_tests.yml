version: 2

# Unit tests for the SILVER layer.
#
# THE DESIGN THESE ASSERT
#
#   int_trade_sequence looks FORWARD. `prior_version` carries the version of the
#   NEXT arrival for the same trade within the same run, so it is non-null
#   exactly when this record is superseded by a later arrival in the same run.
#   Only the final arrival for a trade has a null prior_version.
#
#   int_trade_validation turns that into a decision. A record that had already
#   matured when it arrived is rejected first; a superseded record is rejected
#   second; everything else is accepted.
#
#   The invariant this produces is what keeps the GOLD merge safe:
#   AT MOST ONE ACCEPTED RECORD PER trade_id PER RUN.
#
# Expiry is not asserted here. It is a property of a record already in the store,
# not of an arriving message, so it lives in models/marts/unit_tests.yml.
#
# These assert rule LOGIC against fixture rows rather than against whatever
# happens to be loaded in Snowflake, so they are deterministic and stay green on
# a fresh clone with an empty RAW.

unit_tests:

  # ---------------------------------------------------------------- sequencing

  - name: a_single_arrival_is_not_superseded
    description: >
      One record for a trade. Nothing follows it, so prior_version is null and it
      is the record the run will act on. Nothing precedes it, so
      previously_established is null.
    model: int_trade_sequence
    given:
      - input: ref('stg_trades')
        rows:
          - {trade_id: "T1", trade_version: 1, event_timestamp: "2026-01-01 09:00:00", surrogate_key: 1, maturity_date: "2027-01-01", ingested_at: "2026-01-01 10:00:00"}
    expect:
      rows:
        - {trade_id: "T1", prior_version: null, previously_established: null}

  - name: only_the_last_arrival_in_a_run_is_not_superseded
    description: >
      Three arrivals for one trade, ordered by (event_timestamp, surrogate_key).
      prior_version looks forward, so each record carries the version of the one
      that follows it and only the final arrival has none.
    model: int_trade_sequence
    given:
      - input: ref('stg_trades')
        rows:
          - {trade_id: "T1", trade_version: 1, event_timestamp: "2026-01-01 09:00:00", surrogate_key: 1, maturity_date: "2027-01-01", ingested_at: "2026-01-01 10:00:00"}
          - {trade_id: "T1", trade_version: 2, event_timestamp: "2026-01-02 09:00:00", surrogate_key: 2, maturity_date: "2027-01-01", ingested_at: "2026-01-02 10:00:00"}
          - {trade_id: "T1", trade_version: 3, event_timestamp: "2026-01-03 09:00:00", surrogate_key: 3, maturity_date: "2027-01-01", ingested_at: "2026-01-03 10:00:00"}
    expect:
      rows:
        - {trade_id: "T1", surrogate_key: 1, prior_version: 2, previously_established: null}
        - {trade_id: "T1", surrogate_key: 2, prior_version: 3, previously_established: 1}
        - {trade_id: "T1", surrogate_key: 3, prior_version: null, previously_established: 1}

  - name: ordering_is_deterministic_when_event_timestamps_tie
    description: >
      Two arrivals for one trade sharing an event_timestamp. surrogate_key breaks
      the tie, so the higher surrogate_key is treated as the later arrival and is
      the one left unsuperseded.
    model: int_trade_sequence
    given:
      - input: ref('stg_trades')
        rows:
          - {trade_id: "T1", trade_version: 1, event_timestamp: "2026-01-01 09:00:00", surrogate_key: 1, maturity_date: "2027-01-01", ingested_at: "2026-01-01 10:00:00"}
          - {trade_id: "T1", trade_version: 2, event_timestamp: "2026-01-01 09:00:00", surrogate_key: 2, maturity_date: "2027-01-01", ingested_at: "2026-01-01 10:00:00"}
    expect:
      rows:
        - {trade_id: "T1", surrogate_key: 1, prior_version: 2}
        - {trade_id: "T1", surrogate_key: 2, prior_version: null}

  - name: previously_established_is_zero_when_no_earlier_arrival_was_viable
    description: >
      A trade whose earlier arrival had already matured never became established,
      so a later arrival must not be treated as though it had. Null means "no
      earlier arrival at all"; 0 means "earlier arrivals existed, none viable".
    model: int_trade_sequence
    given:
      - input: ref('stg_trades')
        rows:
          - {trade_id: "T1", trade_version: 1, event_timestamp: "2026-01-01 09:00:00", surrogate_key: 1, maturity_date: "2025-01-01", ingested_at: "2026-01-01 10:00:00"}
          - {trade_id: "T1", trade_version: 2, event_timestamp: "2026-01-02 09:00:00", surrogate_key: 2, maturity_date: "2025-01-01", ingested_at: "2026-01-02 10:00:00"}
    expect:
      rows:
        - {trade_id: "T1", surrogate_key: 1, prior_version: 2, previously_established: null}
        - {trade_id: "T1", surrogate_key: 2, prior_version: null, previously_established: 0}

  # ------------------------------------------------------------ rule decisions

  - name: a_superseded_arrival_is_rejected_and_the_last_one_is_accepted
    description: >
      The invariant the GOLD merge depends on. Two arrivals for one trade in the
      same run - which happens whenever a run carries more than one batch file -
      leave exactly one ACCEPTED record.
    model: int_trade_validation
    given:
      - input: ref('int_trade_sequence')
        rows:
          - {trade_id: "T1", trade_version: 1, maturity_date: "2027-01-01", ingested_at: "2026-01-03 10:00:00", prior_version: 2, previously_established: null, surrogate_key: 1}
          - {trade_id: "T1", trade_version: 2, maturity_date: "2027-01-01", ingested_at: "2026-01-03 10:00:00", prior_version: null, previously_established: 1, surrogate_key: 2}
    expect:
      rows:
        - {surrogate_key: 1, validation_status: "REJECTED", rejection_reason: "LOWER_VERSION"}
        - {surrogate_key: 2, validation_status: "ACCEPTED", rejection_reason: null}

  - name: past_maturity_on_arrival_is_rejected
    description: >
      A message whose maturity date had already passed on the day it was ingested
      is rejected outright.
    model: int_trade_validation
    given:
      - input: ref('int_trade_sequence')
        rows:
          - {trade_id: "T1", trade_version: 1, maturity_date: "2025-01-01", ingested_at: "2026-01-01 10:00:00", prior_version: null, previously_established: null, surrogate_key: 1}
    expect:
      rows:
        - {trade_id: "T1", validation_status: "REJECTED", rejection_reason: "PAST_MATURITY"}

  - name: maturity_on_the_ingestion_date_is_still_accepted
    description: >
      The boundary. The check is a strict `<`, so a trade maturing on the day it
      arrives is still live and must not be rejected.
    model: int_trade_validation
    given:
      - input: ref('int_trade_sequence')
        rows:
          - {trade_id: "T1", trade_version: 1, maturity_date: "2026-01-01", ingested_at: "2026-01-01 10:00:00", prior_version: null, previously_established: null, surrogate_key: 1}
    expect:
      rows:
        - {trade_id: "T1", validation_status: "ACCEPTED", rejection_reason: null}

  - name: past_maturity_takes_precedence_over_supersession
    description: >
      Precedence - an intrinsic property of the record is checked before its
      position in the run. A record that is both matured and superseded is
      reported as PAST_MATURITY.
    model: int_trade_validation
    given:
      - input: ref('int_trade_sequence')
        rows:
          - {trade_id: "T1", trade_version: 1, maturity_date: "2025-01-01", ingested_at: "2026-01-03 10:00:00", prior_version: 2, previously_established: 0, surrogate_key: 1}
    expect:
      rows:
        - {trade_id: "T1", validation_status: "REJECTED", rejection_reason: "PAST_MATURITY"}

  - name: past_maturity_is_rejected_even_when_an_earlier_arrival_was_established
    description: >
      Rule 3 is applied unconditionally in the current design - previously
      established or not, an already-matured message is rejected. Nothing is lost:
      expiry of a trade that is ALREADY in the store is handled in GOLD by the
      trade_store post-hook, asserted by rule_4 in models/marts/unit_tests.yml.
    model: int_trade_validation
    given:
      - input: ref('int_trade_sequence')
        rows:
          - {trade_id: "T1", trade_version: 2, maturity_date: "2025-01-01", ingested_at: "2026-01-02 10:00:00", prior_version: null, previously_established: 1, surrogate_key: 2}
    expect:
      rows:
        - {trade_id: "T1", validation_status: "REJECTED", rejection_reason: "PAST_MATURITY"}

  - name: new_higher_and_same_version_arrivals_are_all_accepted
    description: >
      Only supersession and past maturity reject. A brand-new trade, an amendment
      and a same-version re-send are each the last arrival for their own trade in
      this run, so all three are accepted and go on to the merge.
    model: int_trade_validation
    given:
      - input: ref('int_trade_sequence')
        rows:
          - {trade_id: "T_NEW",    trade_version: 1, maturity_date: "2027-01-01", ingested_at: "2026-01-01 10:00:00", prior_version: null, previously_established: null, surrogate_key: 1}
          - {trade_id: "T_HIGHER", trade_version: 2, maturity_date: "2027-01-01", ingested_at: "2026-01-02 10:00:00", prior_version: null, previously_established: 1,    surrogate_key: 2}
          - {trade_id: "T_SAME",   trade_version: 2, maturity_date: "2027-01-01", ingested_at: "2026-01-03 10:00:00", prior_version: null, previously_established: 1,    surrogate_key: 3}
    expect:
      rows:
        - {trade_id: "T_NEW",    validation_status: "ACCEPTED", rejection_reason: null}
        - {trade_id: "T_HIGHER", validation_status: "ACCEPTED", rejection_reason: null}
        - {trade_id: "T_SAME",   validation_status: "ACCEPTED", rejection_reason: null}
