version: 2

# Unit tests for the GOLD layer.
#
# THE DESIGN THESE ASSERT
#
#   trade_store is an incremental MERGE on trade_id. SILVER has already reduced a
#   run to at most one ACCEPTED record per trade, so GOLD does not rank or
#   deduplicate. Its job is the CROSS-RUN decision: left-join the arriving record
#   to the stored one and keep it only when the trade is new, or when the arriving
#   version is not older than the stored version.
#
#   Expiry is applied to the stored record - by the status CASE for a record being
#   merged, and by the post-hook for records already in the store whose maturity
#   date has since passed.
#
# is_incremental is overridden explicitly on every test: false exercises the first
# run, true exercises the merge path with a mocked `this`.

unit_tests:

  # --------------------------------------------------------------- first run

  - name: a_new_trade_is_inserted_as_valid
    description: An unseen trade with a future maturity date enters the store as VALID.
    model: trade_store
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_trade_validation')
        rows:
          - {trade_id: "T1", trade_version: 1, event_timestamp: "2026-01-01 09:00:00", surrogate_key: 1, maturity_date: "2099-12-31", price: 10.00, notional_amount: 100.00, validation_status: "ACCEPTED"}
    expect:
      rows:
        - {trade_id: "T1", trade_version: 1, price: 10.00, status: "VALID"}

  - name: rule_4_matured_trade_is_marked_expired
    description: >
      Rule 4 - the status of a stored record follows its maturity date. A trade
      whose maturity has passed shows EXPIRED; one with a future maturity shows
      VALID. This state cannot be produced by loading data, because a freshly
      loaded past-maturity trade is rejected in SILVER first; a fixture is the
      only way to assert it.
    model: trade_store
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_trade_validation')
        rows:
          - {trade_id: "T_EXPIRED", trade_version: 1, event_timestamp: "2020-01-01 09:00:00", surrogate_key: 1, maturity_date: "2020-06-30", price: 10.00, notional_amount: 100.00, validation_status: "ACCEPTED"}
          - {trade_id: "T_VALID",   trade_version: 1, event_timestamp: "2020-01-01 09:00:00", surrogate_key: 2, maturity_date: "2099-12-31", price: 10.00, notional_amount: 100.00, validation_status: "ACCEPTED"}
    expect:
      rows:
        - {trade_id: "T_EXPIRED", status: "EXPIRED"}
        - {trade_id: "T_VALID",   status: "VALID"}

  - name: rejected_records_never_reach_the_trade_store
    description: >
      The store holds accepted trades only. A record SILVER rejected must not
      appear, whatever its rejection reason - the audit of rejections belongs in
      rejected_trades.
    model: trade_store
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_trade_validation')
        rows:
          - {trade_id: "T_OK",  trade_version: 1, event_timestamp: "2026-01-01 09:00:00", surrogate_key: 1, maturity_date: "2099-12-31", price: 10.00, notional_amount: 100.00, validation_status: "ACCEPTED"}
          - {trade_id: "T_REJ", trade_version: 1, event_timestamp: "2026-01-01 09:00:00", surrogate_key: 2, maturity_date: "2020-01-01", price: 77.00, notional_amount: 700.00, validation_status: "REJECTED", rejection_reason: "PAST_MATURITY"}
    expect:
      rows:
        - {trade_id: "T_OK", trade_version: 1, status: "VALID"}

  - name: duplicate_arrivals_for_one_trade_produce_one_row
    description: >
      A run can legitimately carry more than one batch file, so the same trade can
      arrive twice. SILVER accepts the last arrival and rejects the superseded
      one, so the store must end up with exactly one row for the trade, at the
      accepted version.
    model: trade_store
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('int_trade_validation')
        rows:
          - {trade_id: "T1", trade_version: 1, event_timestamp: "2026-01-01 09:00:00", surrogate_key: 1, maturity_date: "2099-12-31", price: 10.00, notional_amount: 100.00, validation_status: "REJECTED", rejection_reason: "LOWER_VERSION"}
          - {trade_id: "T1", trade_version: 2, event_timestamp: "2026-01-02 09:00:00", surrogate_key: 2, maturity_date: "2099-12-31", price: 20.00, notional_amount: 200.00, validation_status: "ACCEPTED"}
    expect:
      rows:
        - {trade_id: "T1", trade_version: 2, status: "VALID"}

  # ------------------------------------------------------- incremental merge

  - name: a_higher_version_replaces_the_stored_version
    description: >
      The cross-run amendment path. The arriving version is newer than the stored
      one, so it is merged and the store moves to the new version.
    model: trade_store
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('int_trade_validation')
        rows:
          - {trade_id: "T1", trade_version: 2, event_timestamp: "2026-02-01 09:00:00", surrogate_key: 2, maturity_date: "2099-12-31", price: 20.00, notional_amount: 200.00, validation_status: "ACCEPTED"}
      - input: this
        rows:
          - {trade_id: "T1", trade_version: 1, event_timestamp: "2026-01-01 09:00:00", maturity_date: "2099-12-31", price: 10.00, notional_amount: 100.00, status: "VALID", updated_timestamp: "2026-01-01 10:00:00"}
    expect:
      rows:
        - {trade_id: "T1", trade_version: 2, status: "VALID"}

  - name: a_stale_lower_version_does_not_reach_the_store
    description: >
      Rule 1 across runs, and the out-of-order case. A version-1 message arriving
      after the store already holds version 2 fails the version filter and
      produces no row, so the merge leaves the stored record untouched.
    model: trade_store
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('int_trade_validation')
        rows:
          - {trade_id: "T1", trade_version: 1, event_timestamp: "2026-03-01 09:00:00", surrogate_key: 3, maturity_date: "2099-12-31", price: 77.00, notional_amount: 700.00, validation_status: "ACCEPTED"}
      - input: this
        rows:
          - {trade_id: "T1", trade_version: 2, event_timestamp: "2026-02-01 09:00:00", maturity_date: "2099-12-31", price: 20.00, notional_amount: 200.00, status: "VALID", updated_timestamp: "2026-02-01 10:00:00"}
    expect:
      rows: []

  - name: rule_2_a_same_version_resend_is_merged_again
    description: >
      Rule 2 - the version filter is `>=`, not `>`, so a re-send at the version
      already stored is merged rather than discarded.
    model: trade_store
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('int_trade_validation')
        rows:
          - {trade_id: "T1", trade_version: 2, event_timestamp: "2026-03-01 09:00:00", surrogate_key: 3, maturity_date: "2099-12-31", price: 250.50, notional_amount: 9999.00, validation_status: "ACCEPTED"}
      - input: this
        rows:
          - {trade_id: "T1", trade_version: 2, event_timestamp: "2026-02-01 09:00:00", maturity_date: "2099-12-31", price: 20.00, notional_amount: 200.00, status: "VALID", updated_timestamp: "2026-02-01 10:00:00"}
    expect:
      rows:
        - {trade_id: "T1", trade_version: 2}

  - name: an_amendment_updates_the_stored_economics
    description: >
      The store must hold the trade's CURRENT state, so when a newer version is
      merged the economics it carries have to land. The generator mutates price
      and notional on every amendment and re-send precisely so that "replaced" is
      distinguishable from "ignored" - with identical values this assertion would
      pass either way.
    model: trade_store
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('int_trade_validation')
        rows:
          - {trade_id: "T1", trade_version: 2, event_timestamp: "2026-02-01 09:00:00", surrogate_key: 2, maturity_date: "2099-12-31", price: 250.50, notional_amount: 9999.00, counterparty: "NEWCO", validation_status: "ACCEPTED"}
      - input: this
        rows:
          - {trade_id: "T1", trade_version: 1, event_timestamp: "2026-01-01 09:00:00", maturity_date: "2099-12-31", price: 100.00, notional_amount: 1000.00, counterparty: "OLDCO", status: "VALID", updated_timestamp: "2026-01-01 10:00:00"}
    expect:
      rows:
        - {trade_id: "T1", trade_version: 2, price: 250.50, notional_amount: 9999.00, counterparty: "NEWCO"}
