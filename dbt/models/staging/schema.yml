version: 2

models:
  - name: stg_trades
    description: >
      Relational projection of payload from RAW.RAW_TRADES table. 
      Extraction and casting only; one row per RAW row.
    columns:
      - name: surrogate_key
        description: Inherited from RAW; one row per RAW row.
        tests:
          - unique
          - not_null
      - name: trade_id
        tests:
          - not_null
      - name: trade_version
        tests:
          - not_null
      - name: maturity_date
        description: Trade maturity date, used for settlement and risk calculations.
        tests:
          - not_null
      - name: event_timestamp
        description: Primary ordering key for reconstructing arrival order.
        tests:
          - not_null
      - name: batch_id
        tests:
          - not_null
      - name: source_file_name
        tests:
          - not_null
      - name: ingested_at
        tests:
          - not_null
